# ─────────────────────────────────────────
# 11. OPERATING PRINCIPLES (from global-rules.md)
# ─────────────────────────────────────────
operating_principles:
  - name: "Think-Out-Loud (TOL)"
    rule: "Mọi agent ghi lại reasoning trước khi output"
  - name: "Sprint-Centric"
    rule: "Mọi task thuộc 1 sprint. Không làm orphan task"
  - name: "Changelog"
    rule: "Mọi thay đổi cấu trúc log vào Changelog.md"
  - name: "SSOT"
    rule: "Mỗi thông tin chỉ tồn tại ở 1 nơi. Còn lại là backlink"
  - name: "Indexing"
    rule: "Mọi file mới thêm vào INDEX.md tương ứng"
